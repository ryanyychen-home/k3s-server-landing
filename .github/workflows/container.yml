name: Build and publish container

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: landing-container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ryanyychen-home/k3s-server-landing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record immutable image version
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s#image: ${IMAGE}:.*#image: ${IMAGE}:${IMAGE_TAG}#" k8s/deployment.yaml
          if git diff --quiet -- k8s/deployment.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "chore: deploy image ${IMAGE_TAG}"
          git push
